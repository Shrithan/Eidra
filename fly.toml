# Fly.io settings. Change `app` to your own app name (fly launch will offer to do this).
app = "watchworld"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  BOTS = "0"
  # set PUBLIC_URL to your site's https address, for example https://watchworld.fly.dev
  PUBLIC_URL = "https://watchworld.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "watchworld_data"
  destination = "/app/server/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
